# Gửi cho MỌI cú đánh đáng ngờ (ngưỡng - alerts.min-hit-confidence trong config.yml).
# Tham số: {player} {check} {vl} {verbose} {prob_color} {buffer} {avg} {peak}
# (thẻ mô hình [Def]/[Extreme] cố tình không hiện ở đây - chỉ có trong /guard monitor)
alerts-format: "{prefix} &8[&#FF4D6DPHÁT HIỆN&8] {prob_color}{player} &7không qua được kiểm tra &8• {prob_color}{verbose} &8• &7bộ đệm {buffer}"
# Cảnh báo gộp: cứ mỗi min-hits cú đánh (×3, ×6, ×9...) kèm đỉnh của đợt.
# Tham số: {player} {model} {count} {max} {prob_color} {buffer}
alerts-digest-format: "{prefix} &8[&#FF4D6DPHÁT HIỆN&8] {prob_color}{player} &7không qua được kiểm tra {prob_color}×{count} &8• &7cao nhất {prob_color}{max} &8• &7bộ đệm {buffer}"
alerts-console-format: "[GuardAC] {player} | {verbose} | buffer {buffer}"
# Tự cập nhật: đã tải phiên bản mới, áp dụng sau khi khởi động lại. Tham số: {tag}
update-downloaded: "{prefix} &#4ADE80Bản cập nhật GuardAC &#AEB8C4{tag} &#4ADE80đã tải xong &8- &7sẽ áp dụng sau khi khởi động lại máy chủ."
# Aim Fingerprint: cách ngắm của người chơi đổi đột ngột. Tham số: {player} {base} {now}
fingerprint-alert: "{prefix} &8[&#A78BFACHỮ KÝ&8] &#FF4D6D&l{player} &7- cách ngắm đổi đột ngột &8(&7{base}% &8→ &c{now}%&8)&7, có thể vừa bật hack."
# Cảnh báo sớm cho nhân viên. Tham số: {player} {buffer} {flag}
suspicious-alert: "{prefix} &8[&#FFC857THEO DÕI&8] &#AEB8C4{player} &7đang trở nên đáng ngờ &8(&#FFC857{buffer} &8/ &7{flag}&8)"
# Hiện cho người chơi khi lớp bảo vệ thêm trong giao tranh bật lên (combat-suppression trong config.yml).
suppression-isolate-notice: "&7Kết nối không ổn định &8- &7đòn đánh tạm thời không được tính."

monitor-enabled: "&#4ADE80✔ &7Giám sát &#4ADE80đang bật&7 &8- &7hiện mọi kết quả của mô hình."
monitor-disabled: "&#FFC857● &7Giám sát &8đang tắt&7."
# Tham số: {player} {model} {color} {detailed} {buffer} {prob} {avg} {avg_color} {vl} {ping} {peak} {high_count} {suppression}
monitor-hit: "{prefix} &7{model} {color}{player} &8• {color}{detailed} &8• &7bộ đệm {buffer}{suppression}"

