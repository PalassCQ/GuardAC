# ӘРБІР сенімді соққыға хабарлама (шек - config.yml ішіндегі alerts.min-hit-confidence).
# Толтырғыштар: {player} {check} {vl} {verbose} {prob_color} {buffer} {avg} {peak}
# ([Def]/[Extreme] модель тегі мұнда әдейі көрсетілмейді - ол тек /guard monitor ішінде)
alerts-format: "{prefix} &8[&#FF4D6DАНЫҚТАУ&8] {prob_color}{player} &7тексеруден өтпеді &8• {prob_color}{verbose} &8• &7буфер {buffer}"
# Жинақталған хабарлама: әр min-hits соққы сайын (×3, ×6, ×9...) топтың шыңымен.
# Толтырғыштар: {player} {model} {count} {max} {prob_color} {buffer}
alerts-digest-format: "{prefix} &8[&#FF4D6DАНЫҚТАУ&8] {prob_color}{player} &7тексеруден өтпеді {prob_color}×{count} &8• &7макс {prob_color}{max} &8• &7буфер {buffer}"
alerts-console-format: "[GuardAC] {player} | {verbose} | buffer {buffer}"
# Авто-жаңарту: жаңа нұсқа жүктелді, қайта қосқаннан кейін қолданылады. Толтырғыш: {tag}
update-downloaded: "{prefix} &#4ADE80GuardAC жаңартуы &#AEB8C4{tag} &#4ADE80жүктелді &8- &7сервер қайта қосылғанда қолданылады."
# Aim Fingerprint: ойыншының көздеу мәнері күрт өзгерді. Толтырғыштар: {player} {base} {now}
fingerprint-alert: "{prefix} &8[&#A78BFAҚОЛТАҢБА&8] &#FF4D6D&l{player} &7- көздеу мәнері күрт өзгерді &8(&7{base}% &8→ &c{now}%&8)&7, чит қосылған болуы мүмкін."
# Қызметкерлерге ерте ескерту. Толтырғыштар: {player} {buffer} {flag}
suspicious-alert: "{prefix} &8[&#FFC857БАҚЫЛАУ&8] &#AEB8C4{player} &7күдік тудыра бастады &8(&#FFC857{buffer} &8/ &7{flag}&8)"
# Шайқастағы қосымша қорғаныс іске қосылғанда ойыншыға көрсетіледі (config.yml ішіндегі combat-suppression).
