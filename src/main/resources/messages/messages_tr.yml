# HER güvenli vuruş için gönderilir (eşik - config.yml içindeki alerts.min-hit-confidence).
# Yer tutucular: {player} {check} {vl} {verbose} {prob_color} {buffer} {avg} {peak}
# ([Def]/[Extreme] model etiketi burada bilerek gösterilmez - yalnızca /guard monitor içinde vardır)
alerts-format: "{prefix} &8[&#FF4D6DTESPİT&8] {prob_color}{player} &7kontrolü geçemedi &8• {prob_color}{verbose} &8• &7tampon {buffer}"
# Toplu uyarı: her min-hits vuruşta bir (×3, ×6, ×9...) ve grubun en yükseği.
# Yer tutucular: {player} {model} {count} {max} {prob_color} {buffer}
alerts-digest-format: "{prefix} &8[&#FF4D6DTESPİT&8] {prob_color}{player} &7kontrolü geçemedi {prob_color}×{count} &8• &7en yüksek {prob_color}{max} &8• &7tampon {buffer}"
alerts-console-format: "[GuardAC] {player} | {verbose} | buffer {buffer}"
# Otomatik güncelleme: yeni sürüm indirildi, yeniden başlatınca uygulanır. Yer tutucu: {tag}
update-downloaded: "{prefix} &#4ADE80GuardAC güncellemesi &#AEB8C4{tag} &#4ADE80indirildi &8- &7sunucu yeniden başlayınca uygulanacak."
# Aim Fingerprint: oyuncunun nişan alma tarzı aniden değişti. Yer tutucular: {player} {base} {now}
fingerprint-alert: "{prefix} &8[&#A78BFAİMZA&8] &#FF4D6D&l{player} &7- nişan tarzı aniden değişti &8(&7{base}% &8→ &c{now}%&8)&7, hile açılmış olabilir."
# Yetkililere erken uyarı. Yer tutucular: {player} {buffer} {flag}
suspicious-alert: "{prefix} &8[&#FFC857İZLEME&8] &#AEB8C4{player} &7şüpheli olmaya başladı &8(&#FFC857{buffer} &8/ &7{flag}&8)"
# Savaş içindeki ek koruma devreye girdiğinde oyuncuya gösterilir (config.yml içindeki combat-suppression).
suppression-isolate-notice: "&7Bağlantı dengesiz &8- &7vuruşlar geçici olarak sayılmıyor."

monitor-enabled: "&#4ADE80✔ &7İzleme &#4ADE80açık&7 &8- &7modelin her sonucu gösteriliyor."
monitor-disabled: "&#FFC857● &7İzleme &8kapalı&7."
# Yer tutucular: {player} {model} {color} {detailed} {buffer} {prob} {avg} {avg_color} {vl} {ping} {peak} {high_count} {suppression}
monitor-hit: "{prefix} &7{model} {color}{player} &8• {color}{detailed} &8• &7tampon {buffer}{suppression}"

