# ╔══════════════════════════════════════════════════════════════╗
# ║                  GuardAC · Punishments                        ║
# ╚══════════════════════════════════════════════════════════════╝
#
# GuardAC has a single check - the neural "AI" aim analysis. This file decides
# what happens at each violation level (VL). A player gains VL with every
# confirmed detection and loses it over time (config.yml -> vl-decay).
#
# Placeholders usable in commands:
#   <player>          - player name
#   <check>           - check name (always AI)
#   <vl>              - current violation level
#   <verbose>         - model confidence, e.g. "94%"
#
# Special actions:
#   [alert]           - notify staff
#   [log]             - write to console
#   [reset]           - reset the group's VL
#   [wait] <time>     - pause the chain (2s, 40t, 500ms)
#   [broadcast] <msg> - message to all players
#   [animation] <type>- visual show BEFORE the next action (see the list below).
#                       Delete the line and that level has no animation.
#   [kick] <reason>   - kick the player off the server (any name, no ban plugin needed).
#   [ban] <time> <reason> - ban through your ban system (LiteBans / AdvancedBan /
#                       vanilla, see config.yml -> web-commands.ban-bridge).
#                       Time like 30d / 12h / 45m; omit it for a permanent ban.
#                       Works on every server - no tempban plugin required.
#   <command>         - run as console
#
# ── Animations ────────────────────────────────────────────────────────────────
# Write the line exactly like this, as one of the actions of a level:
#
#     - "[animation]"            <- picks a random type every time
#     - "[animation] endrod"     <- always this one
#
# Available types (the name is what you type after [animation]):
#
#   pig        the player is carried up on a pig
#   explode    a ring of fire closes in on him and detonates
#   particles  a spinning column of particles (type/density in config.yml)
#   lightning  five lightning strikes
#   vortex     twin spirals winding upward
#   meteor     a burning comet falls in and hits him
#   cage       a glowing cage shrinks around him
#   endrod     an end rod fires him up like a piston, then shatters
#
# The show runs BEFORE the rest of that level's actions, so the ban or kick
# lands only after it finishes. Length, height, sounds and the final wither
# "kill" sound are all in config.yml -> animations. With
# `animations.auto-on-ban: true` (the default) any level that really punishes
# already plays a random show even without an "[animation]" line - the line is
# only needed to pin a specific type. Staff can also pick one by hand:
# `/guard punish <player> cage`.
#
# `actions` are grouped by VL. The nearest level BELOW fires: at VL=4 the block
# "3" runs. In the default ladder VL1 only warns staff, VL2 kicks with a random
# animation, and VL3+ ban. The inventory only drops when a ban actually follows
# (not on a kick).
#
# This file is only about commands on specific violation levels. Early staff
# warnings and soft in-combat measures live in config.yml instead - they have
# no commands, only thresholds and switches.

Punishments:

  AI:
    checks:
      - "AI"
    actions:
      # VL1 - only warn staff, no action on the player.
      1:
        - "[alert]"
        - "[log]"
      # VL2 - random animation, then a kick (a warning, not a ban). Delete the
      # "[animation]" line if you don't want the show here.
      2:
        - "[alert]"
        - "[log]"
        - "[animation]"
        - "[kick] &#AEB8C4GuardAC &8» &#FF4D6DSuspicious activity detected"
      # VL3+ - random animation, then a ban through your ban system.
      3:
        - "[alert]"
        - "[log]"
        - "[animation]"
        - "[broadcast] &#AEB8C4GuardAC &8» &#FF4D6D<player> &7banned for &#AEB8C430 days &8(&7VL:&#AEB8C4<vl>&8)"
        - "[ban] 30d GuardAC Detection (VL:<vl>)"
      5:
        - "[alert]"
        - "[log]"
        - "[animation]"
        - "[broadcast] &#AEB8C4GuardAC &8» &#FF4D6D<player> &7banned for &#AEB8C430 days &8(&7VL:&#AEB8C4<vl>&8)"
        - "[ban] 30d GuardAC Detection (VL:<vl>)"
      7:
        - "[alert]"
        - "[log]"
        - "[animation]"
        - "[broadcast] &#AEB8C4GuardAC &8» &#FF4D6D<player> &7banned for &#AEB8C430 days &8(&7VL:&#AEB8C4<vl>&8)"
        - "[ban] 30d GuardAC Detection (VL:<vl>)"
      10:
        - "[alert]"
        - "[log]"
        - "[animation]"
        - "[broadcast] &#AEB8C4GuardAC &8» &#FF4D6D<player> &cbanned permanently &8(&7VL:&#AEB8C4<vl>&8)"
        - "[ban] Cheating (GuardAC VL:<vl>)"
        - "[reset]"
